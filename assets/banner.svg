        <text x="722" y="154"><tspan fill="#3fb950">[ ok ]</tspan> started hud</text>
        <text x="1134" y="154" text-anchor="end" fill="#8b949e">0.01 ms</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.85;1" dur="1.6s" fill="freeze"/>
        <text x="722" y="180"><tspan fill="#3fb950">[ ok ]</tspan> started inventory</text>
        <text x="1134" y="180" text-anchor="end" fill="#8b949e">0.02 ms</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.85;1" dur="1.9s" fill="freeze"/>
        <text x="722" y="206"><tspan fill="#3fb950">[ ok ]</tspan> started garage</text>
        <text x="1134" y="206" text-anchor="end" fill="#8b949e">0.00 ms</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.85;1" dur="2.2s" fill="freeze"/>
        <text x="722" y="232"><tspan fill="#3fb950">[ ok ]</tspan> started phone</text>
        <text x="1134" y="232" text-anchor="end" fill="#8b949e">0.01 ms</text>
      </g>
      <g>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.85;1" dur="2.5s" fill="freeze"/>
        <text x="722" y="258" fill="#89cff0">&gt;</text>
        <rect x="738" y="246" width="8" height="15" fill="#e6edf3">
          <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
      </g>
