    <rect width="1200" height="36" fill="#161b22"/>
    <line x1="0" y1="35.5" x2="1200" y2="35.5" stroke="#30363d"/>
    <circle cx="24" cy="18" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="5.5" fill="#febc2e"/>
    <circle cx="60" cy="18" r="5.5" fill="#28c840"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">
      <rect x="84" y="6" width="104" height="30" fill="#0d1117"/>
      <rect x="84" y="6" width="104" height="2" fill="#89cff0"/>
      <text x="100" y="26" fill="#e6edf3">client.lua</text>
      <text x="204" y="26">server.lua</text>
      <text x="308" y="26">fxmanifest.lua</text>
      <text x="441" y="26">App.vue</text>
      <text x="524" y="26">App.jsx</text>
      <g stroke="#30363d">
        <line x1="292.5" y1="12" x2="292.5" y2="30"/>
        <line x1="425.5" y1="12" x2="425.5" y2="30"/>
        <line x1="508.5" y1="12" x2="508.5" y2="30"/>
        <line x1="598.5" y1="12" x2="598.5" y2="30"/>
      </g>
      <circle cx="1062" cy="18" r="4" fill="#3fb950"/>
      <text x="1176" y="22" text-anchor="end">resmon 0.00 ms</text>
    </g>

    <text x="64" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#89cff0"><tspan fill="#6e7681">--</tspan> fivem developer</text>

    <text x="60" y="164" font-family="'Arial Black','Segoe UI Black','Segoe UI',Arial,sans-serif" font-size="74" font-weight="900" fill="#e6edf3" letter-spacing="1">Muffek</text>

    <text x="64" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#8b949e">lua scripts <tspan fill="#89cff0">·</tspan> nui interfaces <tspan fill="#89cff0">·</tspan> rp systems</text>


    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#e6edf3">
      <g transform="translate(64,230)">
        <rect x="0.5" y="0.5" width="70" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <circle cx="16" cy="15.5" r="4" fill="#7380ff"/>
