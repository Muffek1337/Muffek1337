      </g>
      <g transform="translate(144,230)">
        <rect x="0.5" y="0.5" width="70" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
        <circle cx="16" cy="15.5" r="4" fill="#42b883"/>
        <text x="30" y="20.5">Vue</text>
      </g>
      <g transform="translate(224,230)">
