    <line x1="701" y1="102.5" x2="1156" y2="102.5" stroke="#30363d"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#c9d1d9">
