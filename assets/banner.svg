<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muffek - FiveM developer">
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <clipPath id="typing">
      <rect x="716" y="110" width="240" height="26">
        <animate attributeName="width" values="0;240" dur="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
